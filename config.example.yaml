tickers:
  - YDEX
  - OZON
  - SBER
  - LKOH
  - GAZP
  - GMKN
  - ROSN
  - NVTK
  - TATN
  - MTSS
  - MGNT
  - PLZL
  - CHMF
  - DATA
  - T
  - SBMM
  - VTBR
  - RUAL
  - GLDRUB_TOM
  - SLVRUB_TOM
  - CNYRUB_TOM
model:
  path: "model.json"
moex_iss_base_url: "https://iss.moex.com/iss"
algopack_base_url: "https://apim.moex.com/iss/datashop"
storage:
  path: "./trader.db"
risk:
  max_lots: 1
  # target_notional: "15000"        # flat notional per position; overrides max_lots sizing when set
  # max_slippage_pct: "0.003"       # marketable-limit slippage cap (needs tinkoff.order_type: limit)
  # no_trade_after_open_minutes: 15 # pause new orders around the 10:00 MSK open
  # blackout_windows: []            # "RFC3339-start/RFC3339-end" pairs, e.g. CBR key-rate announcements
commission:
  broker: "tinkoff"
  rate: "0.0005"    # 0.05%, T-Bank "Трейдер" tariff — flat rate, no per-trade minimum

finam:
  base_url: "https://api.finam.ru"
  secret_token: ""  # env-only: MOEX_TRADER_FINAM_SECRET_TOKEN

# Sandbox execution: broker: tinkoff + is_paper_trading: false + sandbox: true.
# Orders go to the T-Bank sandbox contour (virtual money, no real trades).
tinkoff:
  endpoint: "sandbox-invest-public-api.tbank.ru:443"
  sandbox: true
  account_id: ""      # pin an existing sandbox account; empty reuses the first one or opens a new one
  pay_in: "1000000"   # rubles; funds a new sandbox account and sets the risk drawdown baseline
  order_type: "limit"  # limit | market; market carries no price at all — use limit + risk.max_slippage_pct
  token: ""           # env-only: MOEX_TRADER_TINKOFF_TOKEN

# Preflight: replay the current configuration over recent MOEX history before start.
# The trader refuses to start when realized P&L is below min_net_pnl or when
# fewer than min_closed_trades trades close in the replay.
preflight:
  enabled: true
  days: 90
  deposit: "100000"
  min_net_pnl: "1"
  min_closed_trades: 1
  # Backtest fill costs applied against the trader. Match the deployed
  # validation convention: 0.05% half-spread + 0.05% adverse slippage per fill.
  spread_pct: "0.0005"
  slippage_pct: "0.0005"

broker: "paper"     # paper | tinkoff | finam
is_paper_trading: true
poll_interval: 5m
telegram:
  chat_id: ""
  # Notifications on BUY/SELL decisions with the execution result (filled /
  # not executed); empty list notifies about every ticker.
  signal_tickers: []
  # Telegram API is blocked in some networks; route it through a proxy, e.g. "socks5://127.0.0.1:3333".
  proxy: ""

# Historical news archive (finanalys format) used to backfill news_sentiment/news_count
# in cmd/exportdataset, cmd/trainmodel and cmd/calibrate (-news-history flag).
# Raw JSONL archive collected by cmd/newsfetch; telegram_channels limit collection.
news:
  # Veto gate: a conflicting real-time news item (sentiment below -veto_sentiment for a BUY,
  # above +veto_sentiment for a SELL, with at least veto_min_count articles) overrides the
  # action to HOLD. Disable with veto_enabled: false.
  veto_enabled: true
  veto_sentiment: "0.5"
  veto_min_count: 1
  # Proxy for t.me/s; falls back to telegram.proxy when empty.
  proxy: ""
  history_path: ""
  raw_path: ""
  telegram_channels: []
