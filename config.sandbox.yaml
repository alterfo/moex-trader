tickers:
  # SBMM is excluded: its api_trade_available_flag is false, so T-Invest API cannot trade it.
  - YDEX
  - OZON
  - SBER
  - LKOH
  - GAZP
  - GMKN
  - ROSN
  - NVTK
  - TATN
  - MTSS
  - MGNT
  - PLZL
  - CHMF
  - DATA
  - T
  - VTBR
  - RUAL
  - POSI
  # GLDRUB_TOM/SLVRUB_TOM/CNYRUB_TOM removed: the model's IMOEX-relative
  # excess-return label is meaningless for FX instruments — walk-forward
  # showed every model that traded them lost money (see AGENTS.md H1
  # findings, 2026-09-16).
model:
  path: "model.json"
  # ensemble_model.json retrained 2026-09-17 on the absolute-10d recipe with
  # real news_sentiment/news_count (6-month Telegram backfill, 18-feature
  # schema, buy/sell 0.60/0.40). Holdout (2026-06-19..09-17, 1M deposit,
  # spread+slippage 0.05%+0.05%) vs identical no-news control, realized P&L:
  # +56379р/253 trades vs +40102р/205 trades, DD 1.60% vs 1.09%. 90-day
  # no-news preflight check (matches live startup gate) +25699р. See AGENTS.md.
  ensemble_path: "ensemble_model.json"
moex_iss_base_url: "https://iss.moex.com/iss"
algopack_base_url: "https://apim.moex.com/iss/datashop"
storage:
  path: "./trader-sandbox.db"
risk:
  # Sized off the walk-forward-validated recipe: flat 15000₽ notional per
  # position, target-position execution. max_lots is a risk-gate ceiling,
  # not the sizing itself (real TargetLots come from target_notional/price);
  # 1000 covers the priciest observed case (~300 lots on VTBR at ~50₽/share)
  # with headroom for a price drop.
  max_lots: 1000
  target_notional: "15000"
  # Marketable-limit slippage cap (requires tinkoff.order_type: limit below):
  # BUY caps at last_price*(1+pct), SELL floors at last_price*(1-pct). The
  # order either fills within the band or not at all — never chases the book.
  max_slippage_pct: "0.003"
  # Skip new orders for this many minutes after the 10:00 MSK main-session
  # open, where spreads are at their widest (opening auction settling).
  no_trade_after_open_minutes: 15
  # "RFC3339-start/RFC3339-end" pairs, e.g. around CBR key-rate announcements.
  # Empty by default — fill in known dates as they're scheduled.
  blackout_windows: []
commission:
  broker: "tinkoff"
  rate: "0.0005"    # T-Bank sandbox charges a flat 0.05% per trade
finam:
  base_url: "https://api.finam.ru"
tinkoff:
  endpoint: "sandbox-invest-public-api.tbank.ru:443"
  sandbox: true
  account_id: ""
  pay_in: "1000000"
  order_type: "limit"
preflight:
  enabled: true
  days: 90
  deposit: "1000000"
  min_net_pnl: "1"
  min_closed_trades: 1
  # Backtest fill costs applied against the trader. Match the deployed
  # validation convention: 0.05% half-spread + 0.05% adverse slippage per fill.
  spread_pct: "0.0005"
  slippage_pct: "0.0005"
broker: "tinkoff"
is_paper_trading: false
poll_interval: 5m
telegram:
  chat_id: ""
  signal_tickers: []
  proxy: "socks5://127.0.0.1:3333"
